[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dirtree-snapshot"
version = "0.10.0"
description = "Generate and compare readable directory snapshots"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["directory-tree", "snapshot", "windows", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
dirtree = "dirtree:main"

[tool.setuptools]
py-modules = ["dirtree", "dirtree_compare", "dirtree_cache", "dirtree_verify"]
packages = ["dirtree_assets"]

[tool.setuptools.package-data]
dirtree_assets = ["*.css", "*.js", "*.svg", "*.html"]
